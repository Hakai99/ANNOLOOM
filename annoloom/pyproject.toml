[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annoloom"
version = "0.1.3"
description = "A modern desktop tool for annotating images with bounding boxes, polygons, and keypoints."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "OpenHands Lisence" }
authors = [
    { name = "Dev Kumar Lahkar" , email = "deshantlahkar@gmail.com" }
]
keywords = ["annotation", "bounding-box", "polygon", "keypoints", "computer-vision", "labeling", "yolo", "coco", "pascal-voc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "PyQt6>=6.6.0",
]

[project.urls]
Homepage = "https://github.com/Hakai99/ANNOLOOM"
Repository = "https://github.com/Hakai99/ANNOLOOM"
Issues = "https://github.com/Hakai99/ANNOLOOM/issues"

[project.scripts]
annoloom = "annoloom.app:main"

[tool.setuptools.packages.find]
include = ["annoloom*"]

[tool.setuptools.package-data]
annoloom = ["resources/*.png"]
